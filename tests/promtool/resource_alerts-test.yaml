        alertname: K8sContainerOOMKilled
        exp_alerts: []
      - eval_time: 10m
        alertname: K8sContainerOOMKilled
        exp_alerts:
          - exp_labels:
              severity: warning
              job: default/a
              instance: default.pod-a.app
              k8s_cluster_name: c1
              k8s_namespace_name: default
              k8s_pod_name: pod-a
              k8s_container_name: app
            exp_annotations:
