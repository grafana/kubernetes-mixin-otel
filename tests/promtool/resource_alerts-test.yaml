              description: 'Container app in pod pod-a (namespace default) restarted after being OOM-killed in the last 15 minutes.'
              runbook_url: 'https://github.com/grafana/kubernetes-mixin-otel/blob/main/runbook.md#alert-name-k8scontaineroomkilled'
