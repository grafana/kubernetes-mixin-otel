mode: daemonset

image:
  repository: otel/opentelemetry-collector-contrib
  tag: "0.153.0"

resources:
  limits:
    memory: 200Mi
    cpu: 200m
  requests:
    memory: 100Mi
    cpu: 50m

presets:
  kubernetesAttributes:
    enabled: true

  kubeletMetrics:
    enabled: true

  hostMetrics:
    enabled: true

  logsCollection:
    enabled: true
    includeCollectorLogs: false

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
    kubeletstats:
      # The `volume` group is not collected by default; it provides the
      # k8s.volume.* metrics used by the Persistent Volumes dashboard.
      metric_groups: [container, pod, node, volume]
      # Emits k8s.volume.type and, for PVC-backed volumes, the
      # k8s.persistentvolumeclaim.name resource attribute.
      # Requires `get` on nodes/proxy (see clusterRole below).
      extra_metadata_labels:
        - k8s.volume.type
    host_metrics:
      scrapers:
        cpu:
          metrics:
            system.cpu.logical.count:
              enabled: true
        load: {}
        memory:
          metrics:
            system.memory.limit:
              enabled: true
        disk: {}
        filesystem: {}
        network: {}

  processors:
    transform/promote_resource_attributes:
      # resource attributes become labels only where the backend promotes them; datapoint attributes always do
      metric_statements:
        - context: datapoint
          statements:
            - set(attributes["k8s.node.name"], resource.attributes["k8s.node.name"]) where resource.attributes["k8s.node.name"] != nil
            - set(attributes["host.name"], resource.attributes["host.name"]) where resource.attributes["host.name"] != nil

    transform/copy_volume_attributes:
    # workaround: volume resource attributes are not promoted by the Prometheus OTLP endpoint
      metric_statements:
        - context: datapoint
          statements:
            - set(attributes["k8s.volume.name"], resource.attributes["k8s.volume.name"]) where resource.attributes["k8s.volume.name"] != nil
            - set(attributes["k8s.volume.type"], resource.attributes["k8s.volume.type"]) where resource.attributes["k8s.volume.type"] != nil
            - set(attributes["k8s.persistentvolumeclaim.name"], resource.attributes["k8s.persistentvolumeclaim.name"]) where resource.attributes["k8s.persistentvolumeclaim.name"] != nil

    memory_limiter:
      check_interval: 1s
      limit_mib: 160 # 80% of 200Mi limit
      spike_limit_mib: 32 # 20% of limit_mib

    k8s_attributes:
      extract:
        otel_annotations: true

    resource/k8sclustername:
      attributes:
        - key: k8s.cluster.name
          action: upsert
          value: kubernetes-mixin-otel

    resource/hostname:
      attributes:
        - key: k8s.node.name
          action: upsert
          value: ${env:K8S_NODE_NAME}
        - key: host.name
          action: upsert
          from_attribute: k8s.node.name

    resourcedetection:
      detectors: [gcp, system]
      timeout: 2s
      override: true

    batch: {}

  exporters:
    otlp_http/metrics:
      endpoint: http://lgtm:9090/api/v1/otlp
      tls:
        insecure: true

    otlp_http/lgtm:
      endpoint: http://lgtm:4318
      tls:
        insecure: true

    prometheus:
      endpoint: "0.0.0.0:8889"
      resource_to_telemetry_conversion:
        enabled: true

  service:
    extensions: [health_check]

    pipelines:
      logs:
        receivers: [file_log]
        processors: [memory_limiter, k8s_attributes, resource/k8sclustername, batch]
        exporters: [otlp_http/lgtm]

      metrics:
        # Runs on every node, so resourcedetection is authoritative here and runs before the k8s attrs.
        receivers: [otlp, host_metrics]
        processors: [
          memory_limiter,
          resourcedetection,
          k8s_attributes,
          resource/k8sclustername,
          resource/hostname,
          transform/promote_resource_attributes,
          transform/copy_volume_attributes,
          batch,
        ]
        exporters: [otlp_http/metrics, prometheus]

ports:
  prometheus:
    enabled: true
    containerPort: 8889
    servicePort: 8889
    protocol: TCP

clusterRole:
  rules:
    # The kubelet /pods endpoint (used by kubeletstats extra_metadata_labels
    # to resolve PVC references) authorizes as `get` on nodes/proxy.
    - apiGroups: ['']
      resources: ['nodes/proxy']
      verbs: ['get']
