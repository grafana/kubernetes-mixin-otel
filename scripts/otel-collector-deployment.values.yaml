mode: deployment
replicaCount: 1

# Single-node test cluster can't fit a surge pod; recreate the old pod before the new.
rollout:
  strategy: Recreate

image:
  repository: otel/opentelemetry-collector-contrib
  tag: "0.153.0"

resources:
  # Runs heavier than the daemonset (k8s_cluster + k8sobjects), so it requests 150Mi not 100Mi.
  limits:
    memory: 200Mi
    cpu: 200m
  requests:
    memory: 150Mi
    cpu: 50m

presets:
  kubernetesAttributes:
    enabled: true

  clusterMetrics:
    enabled: true

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

    k8s_cluster:
      node_conditions_to_report:
        - Ready
        - MemoryPressure
        - DiskPressure
        - PIDPressure
      allocatable_types_to_report:
        - cpu
        - memory
      metrics:
        k8s.container.status.reason:
          enabled: true
        k8s.resource_quota.hard_limit:
          enabled: true
        k8s.resource_quota.used:
          enabled: true

    k8s_objects:
      objects:
        - name: events
          mode: watch

  processors:
    transform/promote_resource_attributes:
      # resource attributes become labels only where the backend promotes them; datapoint attributes always do
      metric_statements:
        - context: datapoint
          statements:
            - set(attributes["k8s.node.name"], resource.attributes["k8s.node.name"]) where resource.attributes["k8s.node.name"] != nil
            - set(attributes["host.name"], resource.attributes["host.name"]) where resource.attributes["host.name"] != nil
            - set(attributes["k8s.resourcequota.name"], resource.attributes["k8s.resourcequota.name"]) where resource.attributes["k8s.resourcequota.name"] != nil

    memory_limiter:
      check_interval: 1s
      limit_mib: 160 # 80% of 200Mi limit
      spike_limit_mib: 32 # 20% of limit_mib

    k8s_attributes:
      extract:
        otel_annotations: true

    resource/k8sclustername:
      attributes:
        - key: k8s.cluster.name
          action: upsert
          value: kubernetes-mixin-otel

    resource/hostname:
      attributes:
        - key: host.name
          action: upsert
          from_attribute: k8s.node.name

    resource/eventservicename:
      # Label k8sobjects events so the frontend's service_name selector matches them.
      attributes:
        - key: service.name
          action: upsert
          value: integrations/kubernetes/eventhandler

    batch: {}

  exporters:
    otlp_http/metrics:
      endpoint: http://lgtm:9090/api/v1/otlp
      tls:
        insecure: true

    otlp_http/lgtm:
      endpoint: http://lgtm:4318
      tls:
        insecure: true

    prometheus:
      endpoint: "0.0.0.0:8889"
      resource_to_telemetry_conversion:
        enabled: true

  service:
    extensions: [health_check]

    pipelines:
      logs:
        receivers: [otlp]
        processors: [memory_limiter, k8s_attributes, resource/k8sclustername, batch]
        exporters: [otlp_http/lgtm]
      logs/events:
        # Separate pipeline so service.name is stamped on events only, not OTLP app logs.
        receivers: [k8s_objects]
        processors: [memory_limiter, k8s_attributes, resource/k8sclustername, resource/eventservicename, batch]
        exporters: [otlp_http/lgtm]
      traces:
        receivers: [otlp]
        processors: [memory_limiter, k8s_attributes, resource/k8sclustername, batch]
        exporters: [otlp_http/lgtm]
      metrics:
        # Processor order matters: data flows through processors in the order listed.
        receivers: [otlp, k8s_cluster]
        processors: [
          memory_limiter,
          k8s_attributes,
          resource/k8sclustername,
          resource/hostname,
          transform/promote_resource_attributes,
          batch,
        ]
        exporters: [otlp_http/metrics, prometheus]

ports:
  prometheus:
    enabled: true
    containerPort: 8889
    servicePort: 8889
    protocol: TCP
